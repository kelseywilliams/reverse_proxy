worker_processes auto;

# Global error log
error_log /logs/nginx_error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
    accept_mutex on;
}

http {
    # Essential for proper CSS/JS serving
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Define log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Global access log
    access_log /logs/nginx_access.log main;

    # Zone 1: General website traffic (10 requests per second)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;

    # Zone 2: API endpoints (5 requests per second)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # Zone 3: Authentication endpoints (2 requests per second - very strict!)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # Zone 4: Connection limiting (max concurrent connections per IP)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Status code for rate limit responses
    limit_req_status 429;
    limit_conn_status 429;

    # Log rate limit events
    limit_req_log_level warn;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost;
        resolver 127.0.0.11;

        # Server-specific logs
        access_log /logs/main_access.log main;
        error_log /logs/main_error.log warn;

        limit_req zone=general_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Mouse application - must come first
        location ^~ /mouse/ {
            # Mouse application logs
            access_log /logs/mouse_access.log main;
            error_log /logs/mouse_error.log warn;

            # Rate limit for mouse app
            limit_req zone=general_limit burst=15 nodelay;

            proxy_pass http://mouse:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.io for mouse
        location /socket.io/ {
            # Socket.io logs
            access_log /logs/socket_access.log main;
            error_log /logs/socket_error.log warn;

            # More lenient for real-time connections
            limit_req zone=general_limit burst=50 nodelay;

            set $upstream http://mouse:3001;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /chat/socket.io/ {
            access_log /logs/socket_access.log main;
            error_log /logs/socket_error.log warn;

            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://chat:3029/socket.io/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Chat app at /chat/*
        location ^~ /chat/ {
            access_log /logs/socket_access.log main;
            error_log /logs/socket_error.log warn;

            limit_req zone=general_limit burst=15 nodelay;

            proxy_pass http://chat:3029;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: localhost/api/route/endpoint -> http://api:3028/route/endpoint

        # Stricter rate limiting for authentication endpoints
        location ~ ^/api/auth/(register|login|logout|delete|send-code|send-recovery|forgot) {
            access_log /logs/api_access.log main;
            error_log /logs/api_error.log warn;

            # Very strict rate limiting for auth endpoints (5 req/min)
            limit_req zone=auth_limit burst=10;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:3028;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/chat/(new|read|delete) {
            access_log /logs/api_access.log main;
            error_log /logs/api_error.log warn;

            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 5;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:3028;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/resource/ {
            access_log /logs/api_access.log main;
            error_log /logs/api_error.log warn;

            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 5;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:3028;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Moderate rate limiting for verification endpoints
        location ~ ^/api/auth/(user|admin) {
            access_log /logs/api_access.log main;
            error_log /logs/api_error.log warn;

            # Less restrictive for verification endpoints
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 5;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:3028;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health probes - own bucket so probe traffic doesn't spend the api_limit budget
        location ~ ^/api/(healthz|readyz) {
            access_log /logs/api_access.log main;
            error_log /logs/api_error.log warn;

            limit_req zone=general_limit burst=15 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:3028;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catch-all for any other API route
        location /api/ {
            access_log /logs/api_access.log main;
            error_log /logs/api_error.log warn;

            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 5;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api:3028;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Home app catch-all
        location / {
            access_log /logs/main_access.log main;
            error_log /logs/main_error.log warn;

            limit_req zone=general_limit burst=15 nodelay;

            proxy_pass http://home:3027;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
